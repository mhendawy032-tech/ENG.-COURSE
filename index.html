nt company is based in Germany.","The parent company has issued a statement about the recent change of ownership."]}]},{"w":"partner","s":[{"p":"noun","f":"partner (person/organization); n. partnership (association)","r":"active partner, silent partner, trading partner, partnership agreement, to form/dissolve a partnership","x":["He was made a partner in the law firm after four years as an employee.","We have formed a partnership with our distributor in Argentina."]}]},{"w":"perform","s":[{"p":"verb","f":"perform; n. performance","r":"outperform (perform better than), underperform (perform badly), performance appraisal (chiefly British English), performance-related pay (chiefly British English)","x":["The company has performed well in difficult conditions.","We need to review the performance of our manufacturing division."]}]},{"w":"president","s":[{"p":"noun","f":"president (person) (Brit.: chairman)","r":"presidency (being president), vice president (VP)","x":["She has been president of a large mining company for six years.","The company has expanded under his presidency."]}]},{"w":"privatize","s":[{"p":"verb","f":"privatize (Brit. also privatise); n. privatization (Brit. also privatisation) (opposite: nationalize) (Brit. also nationalise)","x":["The government privatized the water companies two years ago.","Profits have doubled since the railways were privatized."]}]},{"w":"profit","s":[{"p":"noun","f":"also v. profit; adj. profitable (opposite: unprofitable)","r":"gross/net profit, profit-making (opposite: non-profit-making), profit and loss, profit sharing, profit center (Brit.: centre)","x":["The success of the new brand increased our profits by 50%.","We hope to profit from the sale of the factory in Scotland."]}]},{"w":"project","s":[{"p":"verb","f":"(1) project; n. projection","r":"financial projections","x":["The company is projecting a 50% increase in profits next year."]},{"p":"noun","f":"(2) project","r":"project manager, project planning","x":["We are  at our annual convention.","They are building a new convention center with impressive facilities.;"]}]},{"w":"delegate","s":[{"p":"noun","f":"delegate","r":"conference delegate","x":["All conference delegates were issued with a badge.","The delegates at the convention represented 40 different countries.","[Note: cannot be used as verb in this sense - see Work Environment!:]"]}]},{"w":"dialog","s":[{"p":"noun","f":"dialog (Brit.: dialogue)","r":"conduct a dialog","x":["The two companies are conducting a dialog over the terms of the agreement.","We have made some progress in our recent dialog with the union."]}]},{"w":"draft","s":[{"p":"verb","f":"also n. draft","r":"rough draft, first/second/final draft, redraft (draft again)","x":["He is redrafting the letter following his managers comments.","Can you take a look at the draft of my monthly sales report?"]}]},{"w":"feedback","s":[{"p":"noun","f":"feedback (no plural form with this meaning)","r":"ask for feedback, provide feedback, useful feedback","x":["Our customer questionnaires provide useful feedback on our products.","Did you get any feedback from the representatives at the conference?"]}]},{"w":"fruitful","s":[{"p":"adjective","f":"fruitful (opposite: unfruitful)","r":"fruitful dialog/negotiations/meeting","x":["We had a very fruitful meeting yesterday and straightened out a lot of our differences.","Negotiations to recover our inventory are not proving very fruitful."]}]},{"w":"haggle","s":[{"p":"verb","f":"haggle (informal)","x":["They're quoting $30,000 for the new network, but if we haggle, they might bring down the price."]}]},{"w":"handout","s":[{"p":"noun","f":"handout; v. hand out","r":"to pass round/circulate handouts","x":["After the talk, the speaker circulated handouts of his charts.","Make sure you prepare handouts to accompany your presentation."]}]},{"w":"intermediary","s":[{"p":"noun","f":"intermediary","x":["He agreed to act as an intermediary between the two companies.","Let's use an intermediary close to the government to lobby for us."]}]},{"w":"item","s":[{"p":"noun","f":"item; v. itemize (to make a list of items) (Brit. also itemise)","r":"item on the agenda, item of business","x":["Let's turn to the next item on the agenda now.","The CEO itemized her objections to the restructuring plans."]}]},{"w":"keynote","s":[{"p":"adjective","f":"keynote","r":"keynote speech, keynote speaker","x":["The keynote speaker this year is from the chamber of commerce.","In her keynote speech, the president outlined the long-term objectives of the corporation."]}]},{"w":"leeway","s":[{"p":"noun","f":"leeway","r":"to allow /give (someone) leeway","x":["We have allowed them considerable leeway to negotiate on the price.","Don't give the distributor too much leeway on delivery times."]}]},{"w":"mediate","s":[{"p":"verb","f":"mediate; n. mediation (no plural form with this meaning); n. mediator (person/organization)","x":["Her offer to mediate in the dispute was rejected by both parties.","The union and management have agreed to mediation to settle the pay claim."]}]},{"w":"microphone","s":[{"p":"noun","f":"microphone","x":["Can the conference center provide us with microphones?","Use the microphone, otherwise the people at the back won't be able to hear."]}]},{"w":"minutes","s":[{"p":"noun","f":"pl. minutes; v. (Brit. only) minute","r":"take minutes, minutes of the (last) meeting","x":["First, we'll run through the minutes of the last meeting.","My assistant will take the minutes and circulate them to everyone."]}]},{"w":"motion","s":[{"p":"noun","f":"motion","r":"move/put forward a motion, pass a motion, support/oppose a motion","x":["The meeting passed a motion to ban smoking..","The dissatisfied stockholders supported a motion to fire the president.","[Note: motion cannot be used as a verb in this sense]"]}]},{"w":"move","s":[{"p":"verb","f":"move","r":"move a proposition/motion/resolution, mover (someone who moves a proposition etc.)","x":["The union representative moved a resolution to ballot the membership.","Could the mover of the motion please stand up."]}]},{"w":"multi-media","s":[{"p":"adjective","f":"also n. multi-media","x":["The conference center can arrange for multi-media presentations, including computer screen projectors, VCRs and much more.","Make full use of multi-media to add variety to your presentation."]}]},{"w":"negotiate","s":[{"p":"verb","f":"negotiate; n. negotiation; n. negotiator/negotiant (person/organization); adj. negotiable (can be negotiated)","r":"negotiate a deal/ an agreement/terms","x":["The management is refusing to negotiate over pay.","All prices in our catalog are negotiable.","[Note: negotiate with someone; negotiate over/about/for something]"]}]},{"w":"OHP","s":[{"p":"noun","f":"OHP (abbreviation of overhead projector)","r":"OHP transparencies (Brit. also OHP slides)","x":["Make sure we have an OHP in the conference room.","He asked his assistant to prepare OHP transparencies of the charts."]}]},{"w":"outline","s":[{"p":"verb","f":"also n. outline","x":["The personnel manager outlined her major objections to the new recruitment policy.","Include an outline of next year's budget in your report."]}]},{"w":"present","s":[{"p":"verb","f":"present; n. presentation","r":"present a report/proposals/plans, to make a presentation","x":["Are you making a presentation at the sales conference?","The president presented the merger plans at the AGM."]}]},{"w":"productive","s":[{"p":"adjective","f":"productive § (opposite: unproductive)","x":["The meeting generated some good ideas and was generally productive.","Negotiations have been unproductive and were suspended yesterday."]}]},{"w":"projector","s":[{"p":"noun","f":"projector","r":"projector (device/machine that projects), slide projector,","x":["We are having problems focusing the slide projector properly.","The company invested in a film projector for in-house presentations."]}]},{"w":"propose","s":[{"p":"verb","f":"propose; n. proposal/proposition","r":"propose an idea/a motion/a plan, an interesting proposition","x":["The production manager proposed a review of safety in the factory.","The board rejected the proposal to relocate to Minnesota."]}]},{"w":"quorum","s":[{"p":"noun","f":"quorum","r":"have a quorum, make a quorum","x":["Do we have enough people present to make a quorum?","There must be six board members present to have a quorum."]}]},{"w":"reception","s":[{"p":"noun","f":"(1) reception area of the office where visitors register (no plural form with this meaning); v. receive (visitors)","x":["All visitors should report to reception."]},{"p":"noun","f":"(2) reception gathering/formal welcoming party","x":[]}]},{"w":"seminar","s":[{"p":"noun","f":"seminar","x":["The book fair will include a number of seminars on production, electronic publishing, and retailing issues.","The company is running a series of seminars to train new employees."]}]},{"w":"session","s":[{"p":"noun","f":"session","r":"morning/afternoon/evening session, opening/closing session, training session","x":["The opening session this morning will be a presentation from the CEO.","Make sure these transparencies are ready for the evening session."]}]},{"w":"summary","s":[{"p":"noun","f":"summary; v. summarize (Brit. also summarise)","r":"summarize a report/an argument, present a summary (of something)","x":["Include a summary of the main points at the top of your report.","The financial manager summarized the results for the last period."]}]},{"w":"teleconference","s":[{"p":"noun","f":"teleconference","x":["We are arranging a teleconference with all our branch managers to discuss international marketing strategies.","Can you find out the cost of a 30 - minute teleconference between Paris and Washington?"]}]},{"w":"transparency","s":[{"p":"noun","f":"transparency (Brit. also slide)","r":"OHP transparency (slide), color/ black-and-white transparency (slide)","x":["The photographer is preparing color transparencies of the new designs.","We
